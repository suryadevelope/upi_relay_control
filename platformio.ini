; PlatformIO Project Configuration File for Smart Payment Gateway
; Board: ESP32 Dev Module / DOIT ESP32 DEVKIT V1
; Framework: Arduino

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Display: KMRTM24024-SPI 2.8" module, ST7789 controller, 240x320 native, used as
; 320x240 landscape (rotation 1). Same TFT_eSPI setup as tft_display_check, which
; was verified on hardware (compiled driver 0x7789, full 320x240 active area).
; Touch and microSD are intentionally not configured.
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=21
    -DTFT_RST=22
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DSPI_FREQUENCY=20000000
    -DSPI_READ_FREQUENCY=1000000
    -DTFT_RGB_ORDER=1

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    bodmer/TFT_eSPI@2.5.43

